[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "facial-defect-gaze-comparison"
version = "0.2.0"
description = "Research-only webcam versus professional eye-tracker comparison toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "scipy==1.16.1",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
  "ipykernel==6.30.1",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "pytest==8.4.1",
  "reportlab==4.4.9",
]

[project.scripts]
gaze-compare = "gaze_compare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_compare"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
