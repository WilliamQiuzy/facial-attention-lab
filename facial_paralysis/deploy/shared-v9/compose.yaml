services:
  shared-v9:
    image: ghcr.io/williamqiuzy/facial-attention-lab-shared-v9@sha256:ec0e2b34e2233e159d555ab3761fe113f5b768562ba9d9d7bf7c2d7a27d42c95
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    environment:
      SHARED_V9_DEVICE: cpu
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    ports:
      - "127.0.0.1:18090:8080"
