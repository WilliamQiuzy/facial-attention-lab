server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control "no-store" always;

  # The gateway enforces an exact 512 MiB video limit. Leave one MiB for the
  # two bounded JSON fields and multipart framing so the proxy does not reject
  # a boundary-valid recording before the gateway can return its closed JSON.
  client_max_body_size 513m;
  client_body_temp_path /tmp/client_temp;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /api/v1/facial-paralysis/infer {
    proxy_pass http://gateway:8081;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/facial-paralysis/ready {
    proxy_pass http://gateway:8081/readyz;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
